<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-up</title>
</head>
<body>
    <div class="visual">
        <div class="logo">
            <!-- Viewbox is funky. I converted a Google icon to inline svg and this happened. -->
            <svg xmlns="http://www.w3.org/2000/svg" 
                viewBox="-120 -1080 1200 1200">
                <path d="M480-80q-73-9-145-39.5T206.5-207Q150-264 115-351T80-560v-40h40q51 0 105 13t101 39q12-86 54.5-176.5T480-880q57 65 99.5 155.5T634-548q47-26 101-39t105-13h40v40q0 122-35 209t-91.5 144q-56.5 57-128 87.5T480-80Zm-2-82q-11-166-98.5-251T162-518q11 171 101.5 255T478-162Zm2-254q15-22 36.5-45.5T558-502q-2-57-22.5-119T480-742q-35 59-55.5 121T402-502q20 17 42 40.5t36 45.5Zm78 236q37-12 77-35t74.5-62.5q34.5-39.5 59-98.5T798-518q-94 14-165 62.5T524-332q12 32 20.5 70t13.5 82Zm-78-236Zm78 236Zm-80 18Zm46-170ZM480-80Z"/>
            </svg>
            schönesauna
        </div>
        <img class="sauna-photo" src="visuals/background-pic.jpg" alt="A man pours water on a sauna stove">
        <p>Photo by <a href="https://unsplash.com/@huumsauna">HUUM</a> on <a href="https://unsplash.com/">Unsplash</a></p>
    </div>
    <div class="information">
        <div class="hero">
            <p>Sign-up for a season pass for regular relaxation at schönesauna.</p>
            <p>It is preiswert.</p>
        </div>
        <form action="" method="">
            <section class="inputs">
                <h1>Your information</h1>
                <fieldset>
                    <p>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name">
                    </p>
                    <p>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name">
                    </p>
                </fieldset>
                <fieldset>
                    <p>
                        <label for="email">EMAIL</label>
                        <input type="email" name="email">
                    </p>
                    <p>
                        <label for="tel">PHONE NUMBER</label>
                        <input type="tel" name="tel">
                    </p>
                </fieldset>
                <fieldset>
                    <p>
                        <label for="password">PASSWORD *</label>
                        <input type="password" name="password" required>
                    </p>
                    <p>
                        <label for="confirm-password">CONFIRM PASSWORD *</label>
                        <input type="password" name="confirm-password" required>
                    </p>
                </fieldset>
            </section>
            <section>
                <button type="submit">Order</button>
                <span>Already have a season pass? <a href="">Check validity</a></span>
            </section>
        </form>
    </div>
</body>
</html>
