<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-up</title>
</head>
<body>
    <div class="visual">
        <div class="logo"></div>
        <img src="background-pic.jpg" alt="A man pours water on a sauna stove.">
    </div>
    <div class="information">
        <div class="hero">
            <p>Sign-up for a season pass for regular relaxation at schönesauna.</p>
            <p>It is preiswert.</p>
        </div>
        <form action="" method="">
            <div class="inputs">
                <fieldset class="names">
                    <legend>Caption</legend>
                    <label for="first-name">
                        FIRST NAME
                        <input type="text" name="first-name">
                    </label>
                    <label for="last-name">
                        LAST NAME
                        <input type="text" name="last-name">
                    </label>
                </fieldset>
                <fieldset class="contacts">
                    <label for="email">
                        EMAIL
                        <input type="email" name="email">
                    </label>
                    <label for="tel">
                        PHONE NUMBER
                        <input type="tel" name="tel">
                    </label>
                </fieldset>
                <fieldset class="password">
                    <label for="password">
                        PASSWORD
                        <input type="password" name="password">
                    </label>
                    <label for="confirm-password">
                        CONFIRM PASSWORD
                        <input type="password" name="confirm-password">
                    </label>
                </fieldset>
            </div>
            <div class="submit">
                <button type="submit">Order</button>
                <p>Already have a season pass? <a href="">Check validity</a></p>
            </div>
        </form>
    </div>
    
</body>
</html>
